<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadet Directory | BNCC Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Nav -->
  <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <a href="index.html" class="text-red-500 font-bold flex items-center gap-2 text-sm hover:text-red-400 transition">
      <i class="fa-solid fa-arrow-left"></i> Homepage
    </a>
    <h1 class="font-bold text-base sm:text-lg">Cadet Directory</h1>
    <a href="admin.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">
      <i class="fa-solid fa-lock mr-1"></i> Admin
    </a>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full flex-grow">
    <!-- Filter Bar -->
    <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 mb-8 flex flex-col md:flex-row gap-4">
      <div class="flex-grow relative">
        <i class="fa-solid fa-search absolute left-4 top-3 text-slate-500 text-sm"></i>
        <input type="text" id="searchInput" placeholder="Search by name, ID, rank, role..." class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-11 pr-4 py-2 text-sm focus:outline-none focus:border-red-500 text-white">
      </div>
      <div class="flex gap-2">
        <select id="platoonFilter" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-200 focus:outline-none">
          <option value="ALL">All Platoons</option>
          <option value="Boys Platoon">Boys Platoon</option>
          <option value="Girls Platoon">Girls Platoon</option>
          <option value="Band Platoon">Band Platoon</option>
          <option value="Ex-Cadets">Ex-Cadets</option>
        </select>
        <select id="bloodFilter" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-200 focus:outline-none">
          <option value="ALL">All Blood</option>
          <option value="A+">A+</option>
          <option value="B+">B+</option>
          <option value="O+">O+</option>
          <option value="AB+">AB+</option>
        </select>
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="cadetGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Loaded automatically via app.js -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
