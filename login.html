<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadet Login | BNCC Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-red-700 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-lg mb-3 shadow-lg shadow-red-900/40">
        BNCC
      </div>
      <h1 class="text-xl font-bold text-white tracking-wide">Cadet Directory Access</h1>
      <p class="text-xs text-slate-400 mt-1">Sign in to unlock private cadet profiles & records</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="text-xs text-slate-400 font-medium">Cadet Email / ID</label>
        <input type="text" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:border-red-500 focus:outline-none mt-1 text-white" placeholder="cadet@gmail.com">
      </div>
      <div>
        <label class="text-xs text-slate-400 font-medium">Password</label>
        <input type="password" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:border-red-500 focus:outline-none mt-1 text-white" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold transition shadow-lg shadow-red-900/30 text-white mt-2">
        Unlock Dashboard
      </button>
    </form>

    <div class="text-center mt-6">
      <a href="index.html" class="text-xs text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Homepage
      </a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
