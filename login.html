<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadet Login | BNCC Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-red-700 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-lg mb-3 shadow-lg shadow-red-900/40">
        BNCC
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide" id="formTitle">Cadet Login</h1>
      <p class="text-xs text-slate-400 mt-1" id="formSubtitle">Access exclusive unit dashboard and records</p>
    </div>

    <!-- Toggle Buttons -->
    <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 mb-6 text-xs font-semibold">
      <button id="tabLogin" onclick="switchAuth('login')" class="flex-1 py-2 rounded-lg bg-red-600 text-white transition">Sign In</button>
      <button id="tabRegister" onclick="switchAuth('register')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">New Registration</button>
    </div>

    <!-- Form -->
    <form id="authForm" class="space-y-4">
      <div id="registerFields" class="hidden space-y-4">
        <div>
          <label class="text-xs text-slate-400 font-medium">Full Name (English)</label>
          <input type="text" id="authName" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:border-red-500 focus:outline-none mt-1 text-white" placeholder="Mir Rizwan Ahmmed">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 font-medium">Cadet ID</label>
            <input type="text" id="authCadetNo" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:border-red-500 focus:outline-none mt-1 text-white" placeholder="25310136">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-medium">Platoon</label>
            <select id="authPlatoon" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:border-red-500 focus:outline-none mt-1 text-white">
              <option value="Boys Platoon">Boys Platoon</option>
              <option value="Girls Platoon">Girls Platoon</option>
              <option value="Band Platoon">Band Platoon</option>
              <option value="Ex-Cadets">Ex-Cadet</option>
            </select>
          </div>
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-400 font-medium">Official Email</label>
        <input type="email" id="authEmail" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:border-red-500 focus:outline-none mt-1 text-white" placeholder="cadet@gmail.com">
      </div>

      <div>
        <label class="text-xs text-slate-400 font-medium">Password</label>
        <input type="password" id="authPassword" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:border-red-500 focus:outline-none mt-1 text-white" placeholder="••••••••">
      </div>

      <button type="submit" id="authSubmitBtn" class="w-full bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold transition duration-200 shadow-lg shadow-red-900/30 text-white mt-2">
        Sign In
      </button>
    </form>

    <div class="text-center mt-6">
      <a href="index.html" class="text-xs text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Homepage
      </a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
